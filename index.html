<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mis Tickets</title>
<meta name="theme-color" content="#ECECE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Tickets">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECECE9; --card:#FFFFFF; --ink:#1E1E1C; --txt:#1E1E1C; --sec:#6A6A65; --soft:#ECECE9; --soft2:#F4F4F1; --line:#E2E2DE; --track:#DEDEDA;
  --inv:#1E1E1C; --inv-txt:#F4F4F1; --inv-sec:#A9A9A3; --inv-line:#363633; --inv-2:#2A2A28;
  --ok:#4E9A62; --warn:#C9962B; --err:#C4402F;
  --barra:rgba(255,255,255,.94); --sombra:0 8px 24px rgba(30,30,28,.08);
  --r:20px; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121212; --card:#1E1E1D; --ink:#F2F2F0; --txt:#F2F2F0; --sec:#9C9C97; --soft:#2A2A28; --soft2:#252523; --line:#2E2E2C; --track:#2A2A28;
  --inv:#F2F2F0; --inv-txt:#151514; --inv-sec:#5E5E5A; --inv-line:#D2D2CE; --inv-2:#E2E2DE;
  --barra:rgba(30,30,29,.94); --sombra:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.oculto{display:none!important}
.mono{font-family:var(--mono);letter-spacing:.01em}
.envoltura{max-width:720px;margin:0 auto;padding:0 20px}

/* Cabecera */
header.cab{padding:calc(14px + env(safe-area-inset-top)) 0 4px}
.cab .fila{display:flex;align-items:center;gap:12px}
.cab .tit{display:flex;flex-direction:column;gap:2px;min-width:0}
.cab .hoy{font-size:13px;color:var(--sec);font-weight:500;display:flex;align-items:center;gap:8px}
.cab h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.8px;line-height:1.1}
.punto{width:8px;height:8px;border-radius:50%;background:#B5B5AF;border:0;padding:0;flex:none}
.punto.ok{background:var(--ok)}.punto.pend{background:var(--warn)}.punto.err{background:var(--err)}
.cab .der{margin-left:auto}
.boton-icono{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;color:var(--ink);flex:none}
.boton-icono svg.i{width:20px;height:20px}
.boton-icono:active{opacity:.7}

.buscar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 16px;height:48px;margin-top:16px;color:#8C8C86}
.buscar svg.i{width:18px;height:18px}
.buscar input{border:0;outline:0;background:transparent;flex:1;height:100%;color:var(--txt);font-size:16px;min-width:0}
.buscar input::placeholder{color:#8C8C86}

.filtros{display:grid;grid-template-columns:repeat(4,1fr);background:var(--track);border-radius:14px;padding:4px;margin-top:12px}
.filtros button{border:0;background:transparent;border-radius:10px;padding:9px 0;min-height:40px;font-size:13px;font-weight:600;color:var(--sec)}
.filtros button.on{background:var(--card);color:var(--ink)}

.aviso{display:flex;align-items:center;gap:10px;background:var(--inv);color:var(--inv-txt);border-radius:16px;padding:13px 16px;margin-top:16px;font-weight:700;font-size:14.5px}
.aviso svg.i{width:19px;height:19px}

h2.sec{font-size:13px;font-weight:700;color:var(--sec);margin:22px 4px 10px}
.lista{display:flex;flex-direction:column;gap:10px}

/* Billete de la lista: producto arriba, tienda debajo */
.ticket{--fondo:var(--bg);position:relative;display:block;background:var(--card);border-radius:var(--r);padding:0;border:0;text-align:left;width:100%;color:var(--txt)}
.ticket:active{transform:scale(.99)}
.ticket .arriba{display:flex;gap:12px;align-items:center;padding:16px 18px 14px}
.ticket .cuerpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ticket .tienda{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .concepto{color:var(--sec);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.ticket .concepto svg.i{width:14px;height:14px}
.ticket .importe{font-weight:800;font-size:19px;white-space:nowrap}
.ticket .abajo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 18px 15px;font-size:13px}
.ticket .fecha{color:var(--sec);margin-right:auto}
.corte{position:relative;height:0;border-top:1.5px dashed var(--track);margin:0 18px}
.corte::before,.corte::after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--fondo,var(--bg))}
.corte::before{left:-28px}.corte::after{right:-28px}
.ticket.oscuro{background:var(--inv);color:var(--inv-txt)}
.ticket.oscuro .concepto,.ticket.oscuro .fecha{color:var(--inv-sec)}
.ticket.oscuro .corte{border-color:var(--inv-line)}
.ticket.oscuro .chip{background:var(--inv-2);color:var(--inv-txt)}
.ticket.oscuro .chip.alerta{background:var(--inv-txt);color:var(--inv)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 11px;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.alerta{background:var(--inv);color:var(--inv-txt);font-weight:700}
.chip.peligro{background:transparent;border:1px solid var(--ink);color:var(--ink);font-weight:700}
.chip svg.i{width:14px;height:14px}

.vacio{text-align:center;color:var(--sec);padding:48px 20px}
.vacio svg.i{width:48px;height:48px;stroke-width:1.2;margin-bottom:12px}
.vacio b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* Barra inferior flotante */
nav.barra{position:fixed;left:20px;right:20px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;max-width:440px;margin:0 auto;height:66px;background:var(--barra);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:999px;padding:0 8px;box-shadow:var(--sombra)}
@media (prefers-color-scheme:dark){nav.barra{border:1px solid var(--line)}}
nav.barra .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:100%}
nav.barra .tab{border:0;background:transparent;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--sec);height:52px;border-radius:999px}
nav.barra .tab svg.i{display:none}
nav.barra .tab.on{color:var(--ink);font-weight:700}
.mas{width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--card);display:grid;place-items:center}
.mas svg.i{width:22px;height:22px;stroke-width:2}

/* Pantallas superpuestas */
.capa{--fondo:var(--bg);position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(30px + env(safe-area-inset-bottom));animation:entra .2s ease}
@keyframes entra{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.capa .top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 20px 10px}
.capa .top h3{font-size:15px;font-weight:700;margin:0;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.capa .top .acc{border:0;background:var(--ink);color:var(--card);font-weight:700;height:46px;padding:0 18px;font-size:14px;border-radius:999px}
.capa .top .acc.sec{background:var(--card);color:var(--ink)}

/* Ficha */
.billete{position:relative;background:var(--card);color:var(--txt);border-radius:26px}
.billete .zona{padding:22px}
.billete .fecha-f{font-size:13px;color:var(--sec);font-weight:500}
.billete .tn{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin-top:4px}
.billete .sub{font-size:14px;color:var(--sec);font-weight:600;margin-top:4px}
.eti{font-size:12px;color:var(--sec);font-weight:600}
.ruta{padding-top:16px}
.ruta .extremos{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ruta .ext{display:flex;flex-direction:column}
.ruta .ext b{font-size:17px;font-weight:800}
.ruta .ext.der{text-align:right}
.ruta .queda{font-size:12px;font-weight:700;padding-bottom:2px;text-align:center}
.ruta .linea{position:relative;height:10px;margin-top:8px;display:flex;align-items:center}
.ruta .linea::before{content:"";position:absolute;left:0;right:0;border-top:1.5px dashed var(--track)}
.ruta .linea i{position:absolute;left:0;height:2px;background:var(--ink);border-radius:2px}
.ruta .linea .p0,.ruta .linea .p1{position:absolute;width:8px;height:8px;border-radius:50%;box-sizing:border-box}
.ruta .linea .p0{left:0;background:var(--ink)}
.ruta .linea .p1{right:0;border:1.5px solid var(--ink);background:var(--card)}
.ruta.vencida .ext b,.ruta.vencida .queda{color:var(--sec)}
.ruta.alerta .queda{background:var(--inv);color:var(--inv-txt);border-radius:999px;padding:3px 9px;margin-bottom:-1px}
.marca{margin-top:16px}
.lista-p{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;line-height:1.6}
.lista-p .eti{display:block;margin-bottom:2px}

.tarjeta-osc{margin-top:12px;background:var(--inv);color:var(--inv-txt);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:16px}
.tarjeta-osc .total{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tarjeta-osc .total span{font-size:13px;color:var(--inv-sec);font-weight:600}
.tarjeta-osc .total b{font-size:30px;font-weight:800;letter-spacing:-.8px}
.tarjeta-osc .filas{display:flex;flex-direction:column;border-top:1px solid var(--inv-line)}
.tarjeta-osc .fd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--inv-line);font-size:13px}
.tarjeta-osc .fd:last-child{border-bottom:0}
.tarjeta-osc .fd span{color:var(--inv-sec);flex:none}
.tarjeta-osc .fd b{font-family:var(--mono);font-weight:500;font-size:13px;text-align:right;word-break:break-all}
.tarjeta-osc .codigo{background:#FFFFFF;color:#111111;border-radius:16px;padding:14px 16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tarjeta-osc .codigo span{font-family:var(--mono);font-size:12px;letter-spacing:.12em;word-break:break-all;text-align:center}

.fila-fotos{margin-top:12px;width:100%;height:66px;border-radius:20px;border:0;background:var(--card);display:flex;align-items:center;gap:12px;padding:0 14px 0 12px;color:var(--ink);text-align:left}
.fila-fotos .mini{width:42px;height:46px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:#8C8C86;overflow:hidden;flex:none}
.fila-fotos .mini img{width:100%;height:100%;object-fit:cover}
.fila-fotos .t{flex:1;display:flex;flex-direction:column}
.fila-fotos .t b{font-size:15px}.fila-fotos .t small{font-size:12.5px;color:var(--sec)}
.fila-fotos svg.flecha{width:18px;height:18px}
.fila-fotos .mini svg.i{width:20px;height:20px;color:var(--ink)}
.enlace-osc{border:0;background:transparent;color:var(--inv-txt);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;margin:-6px 0 -8px;opacity:.9}
.enlace-osc svg.i{width:18px;height:18px}
.capa textarea{font-family:inherit}

.foto-grande{background:var(--card);border-radius:var(--r);overflow:hidden;display:grid;place-items:center;min-height:200px;max-height:66vh;position:relative}
.foto-grande img{width:100%;max-height:66vh;object-fit:contain;display:block;background:var(--soft2)}
.foto-grande .ph{color:var(--sec);text-align:center;padding:28px;font-size:14px}
.foto-grande .lupa{position:absolute;right:10px;bottom:10px;background:rgba(30,30,28,.72);color:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;display:flex;gap:5px;align-items:center;border:0}

.acciones{display:flex;gap:10px;margin-top:18px}
.acciones .btn{flex:1;min-width:0;padding:0 12px}
@media (max-width:360px){.acciones .btn svg.i{display:none}}
.btn.redondo{flex:none!important;width:54px;height:54px;padding:0;border-radius:50%}

.bloque{background:var(--card);border-radius:var(--r);padding:4px 18px;margin-top:12px}
.dato{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.dato:last-child{border-bottom:0}
.dato .k{color:var(--sec);font-size:13px;width:92px;flex:none;padding-top:1px}
.dato .v{flex:1;font-weight:700;word-break:break-word}

.btn{border:0;border-radius:999px;height:54px;padding:0 18px;font-weight:700;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.btn svg.i{width:20px;height:20px}
.btn.pri,.btn.osc{background:var(--ink);color:var(--card)}
.btn.peligro{color:var(--err)}
.btn.ancho{width:100%;margin-top:12px}
.btn:disabled{opacity:.5}

details.texto{margin-top:14px}
details.texto summary{color:var(--sec);font-size:13px;font-weight:600;padding:8px 4px;list-style:none;text-align:center}
details.texto pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:var(--card);border-radius:16px;padding:14px;color:var(--sec);max-height:300px;overflow:auto}

/* Formulario */
.campo{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
.campo:last-child{border-bottom:0}
.campo > span{display:block;color:var(--sec);font-size:12px;font-weight:600;margin-bottom:4px}
.campo input,.campo textarea{width:100%;border:0;outline:0;background:transparent;font-size:17px;font-weight:700;padding:2px 0;color:var(--txt)}
.campo textarea{resize:vertical;min-height:44px;font-weight:600;font-size:16px}
.campo input::placeholder,.campo textarea::placeholder{color:var(--sec);opacity:.55;font-weight:600}
#e-num,#e-ident,#e-barras{font-family:var(--mono);font-size:16px;font-weight:500}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.opciones{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;background:var(--track);border-radius:14px;padding:4px}
.opciones button{border:0;background:transparent;border-radius:10px;padding:9px 2px;min-height:42px;font-weight:600;font-size:13.5px;color:var(--sec)}
.opciones button.on{background:var(--card);color:var(--ink);font-weight:700}
.hasta{color:var(--sec);font-size:13px;margin-top:8px;min-height:18px}
.hasta input{border:0;background:var(--soft);border-radius:10px;padding:6px 10px;font-weight:700;color:var(--txt);font-size:16px;min-height:38px}
.nota-form{color:var(--sec);font-size:13px;padding:10px 6px 0;line-height:1.5}

.elegir{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.elegir label{border-radius:24px;padding:22px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-weight:700;font-size:16px;cursor:pointer;min-height:150px;justify-content:flex-end;background:var(--card);color:var(--ink)}
.elegir label:first-child{background:var(--inv);color:var(--inv-txt)}
.elegir label svg.i{width:28px;height:28px;margin-bottom:auto}
.elegir small{color:var(--sec);font-weight:500;font-size:13px}
.elegir label:first-child small{color:var(--inv-sec)}
.leyendo{display:flex;align-items:center;gap:10px;color:var(--sec);font-weight:600;padding:14px 4px}
.rueda{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--track);border-top-color:var(--ink);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.leido{display:flex;gap:9px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px;font-weight:600;color:var(--ink)}
.leido svg.i{width:19px;height:19px}

.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fotos.peque{grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.ft{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--card);display:grid;place-items:center;color:var(--sec);border:0;padding:0}
.ft img{width:100%;height:100%;object-fit:cover;display:block}
.ft .pdf{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-family:var(--mono);font-size:12px}
.ft .x{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:50%;background:rgba(30,30,28,.7);color:#fff;display:grid;place-items:center;border:0}
.ft .x svg.i{width:16px;height:16px;stroke-width:2.2}
.ft .modo{position:absolute;left:5px;right:5px;bottom:5px;font-size:11px;font-weight:700;background:rgba(30,30,28,.75);color:#fff;border-radius:999px;padding:5px 4px;border:0;line-height:1.15}
.ft.add{background:transparent;border:1.5px dashed #B9B9B3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer}
.ft.add svg.i{width:24px;height:24px}
.fotos.peque .ft{border-radius:10px}
.fotos.peque .ft.sel{outline:2px solid var(--ink);outline-offset:2px}
.interruptor{display:flex!important;align-items:center;gap:12px}
.interruptor div{flex:1}.interruptor b{display:block;font-size:16px;color:var(--txt)}
.interruptor small{display:block;color:var(--sec);font-size:13px;font-weight:500;margin-top:2px}
.interruptor input{appearance:none;-webkit-appearance:none;width:51px!important;height:31px;border-radius:99px;background:var(--track);position:relative;flex:none;transition:background .2s;padding:0!important;cursor:pointer}
.interruptor input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.interruptor input:checked{background:var(--ink)}.interruptor input:checked::after{transform:translateX(20px)}

/* Visor */
.visor{position:fixed;inset:0;z-index:30;background:#0c0c0b;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.visor img{display:block;width:100%;height:auto;min-height:100%;object-fit:contain;transition:width .2s}
.visor img.zoom{width:220%;max-width:none}
.visor .cerrar{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--inv);color:var(--inv-txt);padding:12px 20px;border-radius:999px;font-weight:600;font-size:14.5px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}

/* Ajustes: carnet */
.carnet{position:relative;background:var(--card);border-radius:26px;padding:22px 20px 20px;margin-top:6px;overflow:hidden}
.carnet .ranura{width:46px;height:6px;border-radius:9px;background:var(--soft);margin:-8px auto 14px}
.carnet .nom{font-size:26px;font-weight:800;letter-spacing:-.6px}
.carnet .sellos{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.carnet .sello{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--sec)}
.carnet .sello.vivo{border-color:var(--ink);color:var(--ink)}

<script>
'use strict';
const VERSION = 'v8';
const $ = s => document.querySelector(s);
const ico = (n, c = '') => `<svg class="i ${c}"><use href="#i-${n}"/></svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => n == null || isNaN(n) ? '' : new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(n);
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const DIAS_PAPELERA = 30, MAX_FOTOS = 6;
const nuevoK = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const esPdf = f => f && f.mime === 'application/pdf';

/* ---------- Fechas ---------- */
const isoLocal = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const hoy = () => isoLocal(new Date());
const aFecha = s => { const [a, m, d] = s.split('-').map(Number); return new Date(a, m - 1, d); };
const sumarDias = (s, n) => { const d = aFecha(s); d.setDate(d.getDate() + n); return isoLocal(d); };
const sumarAnios = (s, n) => { const d = aFecha(s); d.setFullYear(d.getFullYear() + n); return isoLocal(d); };
const entre = (a, b) => Math.round((aFecha(b) - aFecha(a)) / 86400000);
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fCorta = s => { if (!s) return ''; const d = aFecha(s); return d.getDate() + ' ' + MES[d.getMonth()] + ' ' + d.getFullYear(); };
const fMes = s => { const d = aFecha(s); return MES[d.getMonth()] + ' ' + d.getFullYear(); };
const quedan = n => n === 0 ? 'hoy es el último día' : n === 1 ? 'queda 1 día' : 'quedan ' + n + ' días';

/* ---------- Almacenamiento ---------- */
let tickets = [];
let pendientes = new Set();
try { pendientes = new Set(JSON.parse(localStorage.getItem('mt-pend') || '[]')); } catch (e) {}
const cfg = { url: '', clave: '' };
try { cfg.url = localStorage.getItem('mt-url') || ''; cfg.clave = localStorage.getItem('mt-clave') || ''; } catch (e) {}

// Los tickets van en IndexedDB (sin el límite de ~5 MB de localStorage); lo pendiente, en localStorage
let sinIdb = false;
function guardarLocal() {
  try { localStorage.setItem('mt-pend', JSON.stringify([...pendientes])); } catch (e) {}
  const plano = () => { try { localStorage.setItem('mt-tickets', JSON.stringify(tickets)); } catch (e) { aviso('El almacenamiento del iPhone está lleno: libera espacio para guardar más tickets'); } };
  if (sinIdb) return plano();
  idb.dset('tickets', tickets).catch(e => { if (e && e.name === 'QuotaExceededError') aviso('El almacenamiento del iPhone está lleno: libera espacio para guardar más tickets'); else { sinIdb = true; plano(); } });
}
async function cargarTickets() {
  let lista = null;
  try { lista = await idb.dget('tickets'); } catch (e) { sinIdb = true; }
  if (!Array.isArray(lista)) {
    try { lista = JSON.parse(localStorage.getItem('mt-tickets') || '[]'); } catch (e) { lista = []; }
    if (!sinIdb && lista.length) { try { await idb.dset('tickets', lista); localStorage.removeItem('mt-tickets'); } catch (e) { sinIdb = true; } }
  }
  tickets = lista.map(migrar);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

const idb = (() => {
  let db;
  const abrir = () => db ? Promise.resolve(db) : new Promise((ok, ko) => {
    const r = indexedDB.open('mis-tickets', 2);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('img')) d.createObjectStore('img'); if (!d.objectStoreNames.contains('datos')) d.createObjectStore('datos'); };
    r.onsuccess = () => { db = r.result; db.onversionchange = () => { db.close(); db = null; }; ok(db); }; r.onerror = () => ko(r.error);
  });
  const op = (almacen, modo, f) => abrir().then(d => new Promise((ok, ko) => {
    const tx = d.transaction(almacen, modo), st = tx.objectStore(almacen), r = f(st);
    tx.oncomplete = () => ok(r && r.result); tx.onerror = () => ko(tx.error); tx.onabort = () => ko(tx.error);
  }));
  return {
    get: k => op('img', 'readonly', s => s.get(k)).catch(() => null),
    set: (k, v) => op('img', 'readwrite', s => s.put(v, k)),
    del: k => op('img', 'readwrite', s => s.delete(k)).catch(() => {}),
    dget: k => op('datos', 'readonly', s => s.get(k)),
    dset: (k, v) => op('datos', 'readwrite', s => s.put(v, k))
  };
})();

// v1 → v2: de una foto (fotoId/tipo/mini) a una lista de fotos
function migrar(t) {
  if (t.borrado || Array.isArray(t.fotos)) return t;
  t.fotos = (t.fotoId || t.mini || t.tipo) ? [{ k: '0', fotoId: t.fotoId || null, mime: t.tipo === 'pdf' ? 'application/pdf' : 'image/jpeg', mini: t.mini || '' }] : [];
  delete t.fotoId; delete t.tipo; return t;
}
const claveImg = (t, f) => 'img:' + t.id + ':' + f.k;
async function fotoLocal(t, f) { return (await idb.get(claveImg(t, f))) || (f.k === '0' ? await idb.get('img:' + t.id) : null); }
function borrarLocales(t) { (t.fotos || []).forEach(f => idb.del(claveImg(t, f))); idb.del('img:' + t.id); }

/* ---------- Plazos ---------- */
function aplicarPlazos(t) {
  const f = t.fecha || hoy();
  if (t.devOpc !== 'otra') t.devHasta = t.devOpc ? sumarDias(f, +t.devOpc) : null;
  if (t.garOpc !== 'otra') t.garHasta = t.garOpc ? sumarAnios(f, +t.garOpc) : null;
}
// Plazos de la última compra en la misma tienda
function plazosDeTienda(nombre, excepto) {
  const n = norm(nombre); if (!n) return null;
  const p = vivos().filter(x => x.id !== excepto && norm(x.tienda) === n && x.devOpc !== undefined)
    .sort((a, b) => (b.creado || 0) - (a.creado || 0))[0];
  if (!p) return null;
  return {
    tienda: p.tienda, devOpc: p.devOpc, garOpc: p.garOpc,
    devDias: p.devOpc === 'otra' && p.devHasta ? entre(p.fecha, p.devHasta) : null,
    garDias: p.garOpc === 'otra' && p.garHasta ? entre(p.fecha, p.garHasta) : null
  };
}
function usarPlazos(t, p) {
  const f = t.fecha || hoy();
  t.devOpc = p.devOpc; t.garOpc = p.garOpc;
  if (p.devOpc === 'otra') t.devHasta = p.devDias != null ? sumarDias(f, p.devDias) : null;
  if (p.garOpc === 'otra') t.garHasta = p.garDias != null ? sumarDias(f, p.garDias) : null;
  aplicarPlazos(t);
}
// Vuelca lo leído del ticket en los campos que se pueden rellenar (libre(campo) = true)
function aplicarLectura(t, d, libre) {
  if (d.tienda && libre('tienda')) t.tienda = d.tienda;
  if (d.fecha && libre('fecha')) { t.fecha = d.fecha; t.fechaLeida = true; }
  if (d.total != null && libre('total')) t.total = d.total;
  if (d.num && libre('num')) t.num = d.num;
  if (d.nif && !t.nif) t.nif = d.nif;
  if (d.ident && !t.ident) t.ident = d.ident;
  if (d.barras && !t.barras) t.barras = d.barras;
  if (d.productos.length && !(t.productos || []).length) t.productos = d.productos;
  if (d.productos.length && !d.esSuper && libre('concepto')) t.concepto = d.productos[0] + (d.productos.length > 1 ? ' y ' + (d.productos.length - 1) + ' más' : '');
  if (libre('plazos')) {
    const p = plazosDeTienda(t.tienda, t.id);
    if (p) { usarPlazos(t, p); t.plazosTienda = p.tienda; }
    else if (d.esSuper) t.garOpc = 0;
    // Lo que pone el propio ticket manda sobre lo recordado
    if (d.devDias) { t.devOpc = d.devDias; t.plazoLeido = 'devolución de ' + d.devDias + ' días'; }
    if (d.garAnios) { t.garOpc = d.garAnios; t.plazoLeido = (t.plazoLeido ? t.plazoLeido + ' y ' : '') + 'garantía de ' + d.garAnios + (d.garAnios === 1 ? ' año' : ' años'); }
  }
  aplicarPlazos(t);
}

/* ---------- Estado de cada ticket ---------- */
function finDe(t) { if (t.importante) return null; const f = [t.devHasta, t.garHasta].filter(Boolean).sort(); return f.length ? f[f.length - 1] : null; }
function estado(t) {
  const h = hoy(), fin = finDe(t);
  const e = { fin, papelera: !!(fin && fin < h), devAbierta: !!(t.devHasta && t.devHasta >= h), garAbierta: !!(t.garHasta && t.garHasta >= h) };
  if (e.devAbierta) e.diasDev = entre(h, t.devHasta);
  if (e.garAbierta) e.diasGar = entre(h, t.garHasta);
  if (e.papelera) e.borraEn = Math.max(0, entre(h, sumarDias(fin, DIAS_PAPELERA)));
  e.pronto = (e.devAbierta && e.diasDev <= 7) || (e.garAbierta && e.diasGar <= 30);
  return e;
}
const vivos = () => tickets.filter(t => !t.borrado);

// Borrado automático: más de 30 días en la papelera
function purgarLocal() {
  const h = hoy(); let cambio = false;
  tickets = tickets.filter(t => {
    if (t.borrado) return true;
    const f = finDe(t);
    if (f && sumarDias(f, DIAS_PAPELERA) < h) { borrarLocales(t); cambio = true; t.borrado = true; return !!cfg.url; }
    return true;
  }).map(t => t.borrado ? { id: t.id, t: t.t, borrado: true } : t)
    .filter(t => !(t.borrado && !pendientes.has(t.id) && Date.now() - (t.t || 0) > 120 * 86400000 && (cambio = true)));
  if (cambio) guardarLocal();
}

/* ---------- Inicio ---------- */
let filtro = 'todos', texto = '';
function chipDe(t, e) {
  if (e.papelera) return `<span class="chip peligro">Se borra en ${e.borraEn} ${e.borraEn === 1 ? 'día' : 'días'}</span>`;
  const c = [];
  if (e.devAbierta) c.push(e.diasDev <= 7 ? `<span class="chip alerta">${e.diasDev === 0 ? 'Último día para devolver' : 'Devolver en ' + e.diasDev + (e.diasDev === 1 ? ' día' : ' días')}</span>`
    : `<span class="chip">Devolución · ${e.diasDev} días</span>`);
  else if (e.garAbierta) c.push(`<span class="chip ${e.diasGar <= 30 ? 'alerta' : ''}">Garantía hasta ${e.diasGar <= 30 ? fCorta(t.garHasta) : fMes(t.garHasta)}</span>`);
  if (t.importante) c.push(`<span class="chip">No se borra</span>`);
  else if (!e.fin) c.push(`<span class="chip">Sin plazos</span>`);
  return c.join('');
}
function fila(t, oscuro) {
  const e = estado(t), sub = subtitulo(t), n = (t.fotos || []).length;
  return `<button class="ticket ${oscuro ? 'oscuro' : ''}" data-id="${esc(t.id)}">
    <div class="arriba">
      <div class="cuerpo"><span class="tienda">${esc(titulo(t))}</span>${sub ? `<span class="concepto">${esc(sub)}</span>` : ''}</div>
      <div class="importe">${eur(t.total)}</div>
    </div>
    <div class="corte"></div>
    <div class="abajo"><span class="fecha">${fCorta(t.fecha)}${n ? ' · ' + n + (n === 1 ? ' foto' : ' fotos') : ''}</span>${chipDe(t, e)}</div></button>`;
}
function coincide(t) {
  if (!texto) return true;
  const q = norm(texto);
  return [t.tienda, t.concepto, t.num, t.ident, t.barras, t.notas, (t.productos || []).join(' '), t.texto].some(x => norm(x).includes(q));
}
function pintarInicio() {
  const lista = vivos().filter(coincide).map(t => ({ t, e: estado(t) }));
  const orden = (a, b) => (b.t.fecha || '').localeCompare(a.t.fecha || '') || (b.t.creado || 0) - (a.t.creado || 0);
  let html = '';
  if (filtro === 'papelera') {
    const p = lista.filter(x => x.e.papelera).sort((a, b) => a.e.borraEn - b.e.borraEn);
    html += `<p class="nota-form" style="padding-top:18px">Aquí están los tickets con todos los plazos vencidos. Se borran solos (con sus fotos) a los ${DIAS_PAPELERA} días.</p>`;
    html += p.length ? `<div class="lista" style="margin-top:8px">${p.map(x => fila(x.t)).join('')}</div>` : vacio('papelera', 'La papelera está vacía', 'Cuando venzan los plazos de un ticket aparecerá aquí.');
  } else {
    let l = lista.filter(x => !x.e.papelera);
    if (filtro === 'dev') l = l.filter(x => x.e.devAbierta).sort((a, b) => a.e.diasDev - b.e.diasDev);

}

/* ---------- Imágenes ---------- */
function cargarImagen(blob) {
  return new Promise((ok, ko) => {
    const u = URL.createObjectURL(blob), img = new Image();
    img.onload = () => { URL.revokeObjectURL(u); ok(img); }; img.onerror = () => { URL.revokeObjectURL(u); ko(new Error('imagen')); };
    img.src = u;
  });
}
// Dibuja (un trozo de) la imagen en un lienzo de lado máximo `max`
function lienzo(img, max, sx = 0, sy = 0, sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height) {
  const k = Math.min(1, max / Math.max(sw, sh));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(sw * k)); c.height = Math.max(1, Math.round(sh * k));
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
const aBlob = (c, q = .82) => new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
const aMini = c => lienzo(c, 200).toDataURL('image/jpeg', .6);

// Modo escáner: busca el papel, recorta a su borde y deja el fondo blanco y el texto oscuro.
// Devuelve null si la foto no parece un ticket (p. ej. la foto de un producto).
function escanear(img) {
  const W0 = img.naturalWidth, H0 = img.naturalHeight;
  const ch = lienzo(img, 360), w = ch.width, h = ch.height;
  const d = ch.getContext('2d').getImageData(0, 0, w, h).data;
  const lum = new Float32Array(w * h), sat = new Uint8Array(w * h), hist = new Array(256).fill(0);
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    const r = d[i], g = d[i + 1], b = d[i + 2], l = .299 * r + .587 * g + .114 * b;
    lum[p] = l; sat[p] = Math.max(r, g, b) - Math.min(r, g, b); hist[l | 0]++;
  }
  // Umbral de Otsu entre papel y fondo
  const N = w * h; let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sB = 0, wB = 0, mejor = 0, thr = 128;
  for (let i = 0; i < 256; i++) {
    wB += hist[i]; if (!wB) continue; const wF = N - wB; if (!wF) break;
    sB += i * hist[i]; const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
    if (v > mejor) { mejor = v; thr = i; }
  }
  const pap = new Uint8Array(N); for (let p = 0; p < N; p++) pap[p] = lum[p] > thr && sat[p] < 70 ? 1 : 0;
  // Tramo más largo por encima del límite, aguantando huecos cortos (pliegues y sombras del papel)
  const tramo = (arr, lim) => {
    const hueco = Math.max(2, Math.round(arr.length * .05)); let a = -1, b = -1, ia = -1, ult = -1;
    for (let i = 0; i <= arr.length; i++) {
      if (i < arr.length && arr[i] > lim) { if (ia < 0) ia = i; ult = i; }
      else if (ia >= 0 && (i === arr.length || i - ult > hueco)) { if (ult - ia > b - a) { a = ia; b = ult; } ia = -1; }
    }
    return a < 0 ? null : [a, b];
  };
  const filas = new Float32Array(h); for (let y = 0; y < h; y++) { let s = 0; for (let x = 0; x < w; x++) s += pap[y * w + x]; filas[y] = s / w; }
  const ry = tramo(filas, .2); if (!ry) return null;
  const cols = new Float32Array(w); for (let x = 0; x < w; x++) { let s = 0; for (let y = ry[0]; y <= ry[1]; y++) s += pap[y * w + x]; cols[x] = s / (ry[1] - ry[0] + 1); }
  const rx = tramo(cols, .35); if (!rx) return null;
  let dentro = 0; for (let y = ry[0]; y <= ry[1]; y++) for (let x = rx[0]; x <= rx[1]; x++) dentro += pap[y * w + x];
  const area = (rx[1] - rx[0] + 1) * (ry[1] - ry[0] + 1);
  if (area / N < .1 || dentro / area < .55) return null;
  const k = W0 / w, mx = Math.round(W0 * .004), my = Math.round(H0 * .004);
  const sx = Math.max(0, rx[0] * k - mx), sy = Math.max(0, ry[0] * k - my);
  const c = lienzo(img, 2000, sx, sy, Math.min(W0, (rx[1] + 1) * k + mx) - sx, Math.min(H0, (ry[1] + 1) * k + my) - sy);
  // Niveles: negro = percentil 2, blanco = percentil 60 (el papel)
  const x = c.getContext('2d'), im = x.getImageData(0, 0, c.width, c.height), px = im.data, hh = new Array(256).fill(0);
  let n = 0; for (let i = 0; i < px.length; i += 16) { hh[(.299 * px[i] + .587 * px[i + 1] + .114 * px[i + 2]) | 0]++; n++; }
  const pct = q => { let a = 0; for (let i = 0; i < 256; i++) { a += hh[i]; if (a >= q * n) return i; } return 255; };
  const negro = pct(.02), blanco = pct(.6);
  if (blanco - negro < 40) return null;
  for (let i = 0; i < px.length; i += 4) {
    let v = ((.299 * px[i] + .587 * px[i + 1] + .114 * px[i + 2]) - negro) / (blanco - negro);
    v = v <= 0 ? 0 : v >= 1 ? 255 : Math.pow(v, 1.6) * 255;
    px[i] = px[i + 1] = px[i + 2] = v;
  }
  x.putImageData(im, 0, 0);
  return c;
}
async function prepararArchivo(f) {
  if (f.type === 'application/pdf') return { mime: 'application/pdf', blob: f, mini: '' };
  const img = await cargarImagen(f), orig = lienzo(img, 2000);
  let scan = null; try { scan = escanear(img); } catch (e) { scan = null; }
  const o = { mime: 'image/jpeg', blob: await aBlob(orig), mini: aMini(orig) };
  if (!scan) return o;
  return { mime: 'image/jpeg', blob: await aBlob(scan, .8), mini: aMini(scan), alt: o, modo: 'scan' };
}
const aB64 = blob => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
const deB64 = (b64, mime) => { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime }); };

/* ---------- Conexión con Google ---------- */
async function api(accion, datos = {}, ms = 90000) {
  if (!cfg.url || !cfg.clave) throw new Error('sin-config');
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ clave: cfg.clave, accion, ...datos }), signal: ctl.signal });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error === 'clave' ? 'clave' : j.error === 'bloqueado' ? 'bloqueado' : (j.error || 'error'));
    return j;
  } finally { clearTimeout(to); }
}

    } catch (e) {

      ponerEstado(`<div class="leido">${ico('aviso')}${e.message === 'clave' ? 'Contraseña incorrecta (revisa Ajustes)' : 'Sin conexión: guárdalo y lo leeré cuando vuelva la cobertura'}</div>`);
    } finally { leyendo--; enLectura.delete(f.k); }
  }
  async function anadir(archivo) {
    if (t.fotos.length >= MAX_FOTOS) return aviso('Máximo ' + MAX_FOTOS + ' fotos por ticket');
    if (archivo.size > 15 * 1024 * 1024) return aviso('El archivo es muy grande (máx. 15 MB)');
    const f = { k: nuevoK(), fotoId: null, mime: archivo.type === 'application/pdf' ? 'application/pdf' : 'image/jpeg', mini: '' };
    t.fotos.push(f); mem[f.k] = { cargando: true }; pintarFotos();
    let p; try { p = await prepararArchivo(archivo); } catch (e) { t.fotos.splice(t.fotos.indexOf(f), 1); delete mem[f.k]; pintarFotos(); return aviso('No se pudo abrir el archivo'); }
    mem[f.k] = p; f.mime = p.mime; f.mini = p.mini; pintarFotos();
    await leer(f, p.blob);
  }
  v('#e-file').addEventListener('change', async ev => {
    const fs = [...ev.target.files]; ev.target.value = '';
    for (const f of fs) await anadir(f);
  });

  poner(); pintarFotos();
  (async () => { for (const f of archivos || []) await anadir(f); })();

  c.addEventListener('click', async e => {
    const x = e.target.closest('[data-x]'); if (!x) return;
    const a = x.dataset.x;
    if (a === 'quitar') {
      const i = t.fotos.findIndex(f => f.k === x.dataset.k); if (i < 0) return;
      if (t.fotos[i].fotoId && !confirm('¿Quitar esta foto del ticket?')) return;
      delete mem[t.fotos[i].k]; t.fotos.splice(i, 1); pintarFotos(); return;
    }
    if (a === 'modo') {
      const m = mem[x.dataset.k], f = t.fotos.find(f => f.k === x.dataset.k); if (!m || !m.alt || !f) return;
      const otra = { blob: m.blob, mini: m.mini };
      m.blob = m.alt.blob; m.mini = m.alt.mini; m.alt = otra; m.modo = m.modo === 'scan' ? 'orig' : 'scan';
      f.mini = m.mini; pintarFotos(); return;
    }
    if (a === 'cerrar') {
      if (!viejo && (t.fotos.length || v('#e-tienda').value) && !confirm('¿Salir sin guardar este ticket?')) return;
      return cerrarCapa();
    }
    if (a === 'borrar') { if (confirm('¿Borrar este ticket y sus fotos?')) { borrarTicket(t.id); cerrarCapa(); cerrarCapa(); aviso('Ticket borrado'); } return; }
    if (a === 'guardar') {
      if (Object.values(mem).some(m => m.cargando)) return aviso('Espera a que termine de preparar la foto');
      if (leyendo && !confirm('Todavía estoy leyendo el ticket. ¿Guardar ya? Lo terminaré de leer después.')) return;
      leerCampos();
      if (!t.tienda && !t.concepto && !t.fotos.length && !viejo) return aviso('Escribe al menos la tienda o qué compraste');
      if (tocado.fecha) t.fechaManual = true;
      if (tocado.plazos) { t.plazosManual = true; delete t.plazosTienda; delete t.plazoLeido; }
      aplicarPlazos(t);
      for (const f of t.fotos) if (mem[f.k]) await idb.set(claveImg(t, f), { blob: mem[f.k].blob, mime: f.mime }).catch(() => aviso('No se pudo guardar la foto en el dispositivo'));
      if (viejo) (viejo.fotos || []).forEach(f => { if (!t.fotos.some(g => g.k === f.k)) idb.del(claveImg(viejo, f)); });
      t.fotos.forEach(f => { if (enLectura.has(f.k)) f.leer = true; });
      t.leerPend = t.fotos.some(f => f.leer);
      delete t.mini; t.t = Date.now();
      const i = tickets.findIndex(x => x.id === t.id);
      if (i >= 0) tickets[i] = t; else tickets.unshift(t);
      pendientes.add(t.id); guardarLocal(); pintarInicio(); programarSync();
      cerrarCapa();
      if (viejo) { cerrarCapa(); setTimeout(() => abrirFicha(t.id), 40); }
      aviso(viejo ? 'Cambios guardados' : 'Ticket guardado');
    }
  });
}

function borrarTicket(id) {
  const i = tickets.findIndex(t => t.id === id); if (i < 0) return;
  borrarLocales(tickets[i]);
  if (cfg.url) { tickets[i] = { id, t: Date.now(), borrado: true }; pendientes.add(id); }
  else tickets.splice(i, 1);
  guardarLocal(); pintarInicio(); programarSync();
}

/* ---------- Ficha ---------- */
async function obtenerFoto(t, f) {
  const r = await fotoLocal(t, f); if (r) return r;
  if (!f.fotoId || !cfg.url) return null;
  const j = await api('foto', { fotoId: f.fotoId });
  const v = { blob: deB64(j.b64, j.mime), mime: j.mime };
  idb.set(claveImg(t, f), v).catch(() => {});
  if (!f.mini && /^image\//.test(j.mime)) {
    cargarImagen(v.blob).then(img => {
      const real = tickets.find(x => x.id === t.id), g = real && (real.fotos || []).find(x => x.k === f.k);
      if (!g || g.mini) return;
      g.mini = aMini(lienzo(img, 600)); real.t = Date.now(); pendientes.add(real.id); guardarLocal(); programarSync(4000);
    }).catch(() => {});
  }
  return v;
}
// Título de un ticket: lo comprado; debajo, la tienda
function titulo(t) {
  if (t.concepto) return t.concepto;
  const p = t.productos || [];
  if (p.length) return p[0] + (p.length > 1 ? ' y ' + (p.length - 1) + ' más' : '');
  return t.tienda || 'Sin tienda';
}
const subtitulo = t => titulo(t) !== (t.tienda || 'Sin tienda') ? (t.tienda || '') : '';

// Fotos del ticket en memoria (el menú de compartir del iPhone tiene que abrirse justo al tocar)
function precargar(t, blobs) {
  return Promise.all((t.fotos || []).map(f => blobs[f.k] ? null : obtenerFoto(t, f).then(r => { if (r) blobs[f.k] = r; }).catch(() => {})));
}
function accionFotos(t, blobs, modo, cont) {
  const fotos = t.fotos || [];
  if (!fotos.length) return aviso('Este ticket no tiene fotos');
  if (fotos.some(f => !blobs[f.k])) { aviso('Preparando las fotos… vuelve a pulsar en un momento'); precargar(t, blobs); return; }
  const base = (titulo(t) + ' ' + (t.fecha || '')).trim().replace(/[^\w\- áéíóúñü]/gi, '').slice(0, 60);
  const files = fotos.map((f, i) => { const r = blobs[f.k]; return new File([r.blob], base + (fotos.length > 1 ? ' (' + (i + 1) + ')' : '') + (esPdf(r) ? '.pdf' : '.jpg'), { type: r.mime }); });
  const txt = [titulo(t), t.tienda, t.fecha && 'Compra: ' + fCorta(t.fecha), t.total != null && 'Importe: ' + eur(t.total), t.num && 'Nº ticket: ' + t.num, t.ident && 'Identificador: ' + t.ident].filter(Boolean).join('\n');
  if (modo === 'guardar' && cont) {
    let vista = false; try { vista = localStorage.getItem('mt-pista-guardar') === '1'; localStorage.setItem('mt-pista-guardar', '1'); } catch (e) {}
    if (!vista && !cont.querySelector('.pista-g')) cont.insertAdjacentHTML('beforeend', `<p class="nota-form pista-g" style="text-align:center">En el menú que se abre, elige «Guardar imagen» para llevarla a Fotos${fotos.some(f => esPdf(blobs[f.k])) ? ', o «Guardar en Archivos» si es un PDF' : ''}.</p>`);
  }
  if (navigator.canShare && navigator.canShare({ files })) navigator.share(modo === 'enviar' ? { files, text: txt } : { files }).catch(() => {});
  else files.forEach(fl => { const l = document.createElement('a'); l.href = URL.createObjectURL(fl); l.download = fl.name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(l.href), 4000); });
}

function abrirFicha(id) {
  const t = tickets.find(x => x.id === id); if (!t || t.borrado) return;
  const e = estado(t), fotos = t.fotos || [], blobs = {};
  precargar(t, blobs);
  let resg = null; if (window.extras) extras.resguardo(t, titulo(t)).then(b => resg = b).catch(() => {});
  const dia = s => { const d = aFecha(s); return d.getDate() + ' ' + MES[d.getMonth()]; };
  const ruta = (tipo, hasta, abierta, dias) => {
    const tot = Math.max(1, entre(t.fecha, hasta)), pct = abierta ? Math.min(100, Math.max(0, entre(t.fecha, hoy()) / tot * 100)) : 100;
    const alerta = abierta && dias <= (tipo === 'dev' ? 7 : 30);
    const plazo = tipo === 'dev' ? (abierta ? 'Devolución · ' + (dias === 0 ? 'último día' : dias + (dias === 1 ? ' día' : ' días')) : 'Devolución vencida')
      : (abierta ? 'Garantía · ' + (dias > 365 ? Math.round(dias / 365) + (Math.round(dias / 365) === 1 ? ' año' : ' años') : dias + ' días') : 'Garantía vencida');
    return `<div class="ruta ${alerta ? 'alerta' : ''} ${abierta ? '' : 'vencida'}">
      <div class="extremos">
        <div class="ext"><span class="eti">Compra</span><b>${dia(t.fecha)}</b></div>
        <div class="queda">${plazo}</div>
        <div class="ext der"><span class="eti">${tipo === 'dev' ? 'Último día' : 'Fin'}</span><b>${dia(hasta)}${hasta.slice(0, 4) !== t.fecha.slice(0, 4) ? ' ' + hasta.slice(0, 4) : ''}</b></div>
      </div>
      <div class="linea"><span class="p0"></span><i style="width:${pct}%"></i><span class="p1"></span></div>
    </div>`;
  };
  const rutas = [];
  if (t.devHasta) rutas.push(ruta('dev', t.devHasta, e.devAbierta, e.diasDev));
  if (t.garHasta) rutas.push(ruta('gar', t.garHasta, e.garAbierta, e.diasGar));
  const marca = t.importante ? `<div class="marca"><span class="chip">${ico('candado')}No se borra nunca</span></div>`
    : !rutas.length ? `<div class="marca"><span class="chip">${ico('reloj')}Sin plazos · se guarda hasta que lo borres</span></div>` : '';
  const extra = [(t.productos || []).length > 1 ? `<span class="eti">Productos</span>${t.productos.map(esc).join('<br>')}` : '', t.notas ? `<span class="eti">Notas</span>${esc(t.notas)}` : ''].filter(Boolean);
  const filas = [['Identificador', t.ident], ['Nº ticket', t.num], [t.ident ? '' : 'NIF tienda', t.ident ? '' : t.nif]].filter(d => d[1]);
  const barras = t.barras && window.codigoBarras ? codigoBarras.svg(t.barras, 'currentColor', 54) : '';
  const f0 = fotos[0];
  const sub = subtitulo(t);
  const c = abrirCapa(`<div class="top"><button class="boton-icono" data-x="cerrar" aria-label="Volver">${ico('atras')}</button><h3>Ticket</h3>
      <button class="acc sec" data-x="editar">Editar</button></div>
    <div class="envoltura">
      ${e.papelera ? `<div class="aviso" style="margin:4px 0 12px">${ico('papelera')}En la papelera: se borra en ${e.borraEn} ${e.borraEn === 1 ? 'día' : 'días'}</div>` : ''}
      ${t.leerPend ? `<div class="leido" style="margin:4px 0 12px">${ico('reloj')}Pendiente de leer el texto: lo haré cuando haya conexión</div>` : ''}
      <div class="billete"><div class="zona">
        <div class="fecha-f">${fCorta(t.fecha)}</div>
        <div class="tn"></div>${sub ? `<div class="sub"></div>` : ''}
        ${marca}${rutas.join('')}
        ${extra.length ? `<div class="lista-p">${extra.join('<br><br>')}</div>` : ''}
      </div></div>
      ${t.total != null || filas.length || barras ? `<div class="tarjeta-osc">
        ${t.total != null ? `<div class="total"><span>Total pagado</span><b>${eur(t.total)}</b></div>` : ''}
        ${filas.length ? `<div class="filas">${filas.map(d => `<div class="fd"><span>${d[0]}</span><b>${esc(d[1])}</b></div>`).join('')}</div>` : ''}
        ${barras ? `<div class="codigo">${barras}<span>${esc(t.barras)}</span></div>` : ''}
        <button class="enlace-osc" data-x="resguardo">${ico('descargar')}Guardar resguardo en Fotos</button>
      </div>` : ''}
      <button class="fila-fotos" data-x="fotos">
        <span class="mini">${f0 && f0.mini ? `<img src="${esc(f0.mini)}" alt="">` : ico(esPdf(f0) ? 'archivo' : 'ticket')}</span>
        <span class="t"><b>${fotos.length ? 'Fotos del ticket' : 'Sin fotos'}</b><small>${fotos.length ? fotos.length + (fotos.length === 1 ? ' foto' : ' fotos') + ' · ver y ampliar' : 'Añadir una foto del ticket'}</small></span>
        <svg class="i flecha"><use href="#i-adelante"/></svg>
      </button>
      <button class="fila-fotos" data-x="reclamar">
        <span class="mini">${ico('mensaje')}</span>
        <span class="t"><b>Reclamar o devolver</b><small>Texto listo para la tienda, con el ticket adjunto</small></span>
        <svg class="i flecha"><use href="#i-adelante"/></svg>
      </button>
      <div class="acciones">
        <button class="btn pri" data-x="guardar">${ico('descargar')}Guardar</button>
        <button class="btn" data-x="compartir">${ico('compartir')}Enviar</button>
        <button class="btn redondo" data-x="borrar" aria-label="Borrar">${ico('papelera')}</button>
      </div>
      ${e.papelera ? `<button class="btn ancho" data-x="conservar">Conservar un año más</button>` : ''}
      ${t.texto ? `<details class="texto"><summary>Ver texto leído del ticket</summary><pre></pre></details>` : ''}
    </div>`);
  c.querySelector('.tn').textContent = titulo(t);
  if (sub) c.querySelector('.sub').textContent = sub;
  if (t.texto) c.querySelector('pre').textContent = t.texto;
  c.addEventListener('click', ev => {
    const x = ev.target.closest('[data-x]'); if (!x) return;
    const a = x.dataset.x;
    if (a === 'cerrar') cerrarCapa();
    else if (a === 'editar') editar(t.id, []);
    else if (a === 'fotos') fotos.length ? abrirFotos(t, blobs) : editar(t.id, []);
    else if (a === 'borrar') { if (confirm('¿Borrar este ticket y sus fotos?')) { borrarTicket(t.id); cerrarCapa(); aviso('Ticket borrado'); } }
    else if (a === 'conservar') { t.garHasta = sumarAnios(hoy(), 1); t.garOpc = 'otra'; t.t = Date.now(); pendientes.add(t.id); guardarLocal(); pintarInicio(); programarSync(); cerrarCapa(); aviso('Se conserva hasta ' + fCorta(t.garHasta)); }
    else if (a === 'compartir') accionFotos(t, blobs, 'enviar');
    else if (a === 'guardar') accionFotos(t, blobs, 'guardar', x.closest('.acciones').parentNode);

      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file] }).catch(() => {});
      else { const l = document.createElement('a'); l.href = URL.createObjectURL(file); l.download = file.name; document.body.appendChild(l); l.click(); l.remove(); }
    }
  });
}

// Reclamar: texto para la tienda (devolución o garantía) y envío con las fotos adjuntas

  const e = estado(t);

  const c = abrirCapa(`<div class="top"><button class="boton-icono" data-x="cerrar" aria-label="Volver">${ico('atras')}</button><h3>Reclamar o devolver</h3><span style="width:46px"></span></div>
    <div class="envoltura">
      <div class="opciones" id="r-tipo" style="margin-top:4px"><button data-v="dev" style="grid-column:span 2">Devolución</button><button data-v="gar" style="grid-column:span 2">Garantía</button></div>

      <div class="bloque"><label class="campo"><span>Qué le pasa (opcional)</span><textarea id="r-problema" rows="2" placeholder="Ej. La batería no carga desde la primera semana"></textarea></label></div>
      <div class="bloque"><label class="campo"><span>Mensaje para la tienda</span><textarea id="r-texto" rows="12" style="font-weight:500;font-size:16px;line-height:1.5"></textarea></label></div>
      <button class="btn ancho pri" data-x="enviar">${ico('compartir')}Enviar con ${(t.fotos || []).length ? 'el ticket adjunto' : 'el texto'}</button>
      <button class="btn ancho" data-x="copiar">${ico('copiar')}Copiar el texto</button>
      <p class="nota-form">Si la tienda no responde o no te da solución, puedes pedir la hoja de reclamaciones en la tienda o reclamar en la oficina de consumo (OMIC) de tu ayuntamiento o de tu comunidad autónoma.</p>
    </div>`);
  const v = s => c.querySelector(s);
  const pintar = () => {
    c.querySelectorAll('#r-tipo button').forEach(b => b.classList.toggle('on', b.dataset.v === tipo));
    const abierto = tipo === 'dev' ? e.devAbierta : e.garAbierta, hasta = tipo === 'dev' ? t.devHasta : t.garHasta;
    v('#r-estado').textContent = !hasta ? (tipo === 'dev' ? 'Este ticket no tiene plazo de devolución guardado.' : 'Este ticket no tiene garantía guardada.')
      : abierto ? (tipo === 'dev' ? 'Puedes devolverlo hasta el ' : 'En garantía hasta el ') + fCorta(hasta) + '.' : 'Ojo: este plazo terminó el ' + fCorta(hasta) + '.';
    if (!tocadoTexto) v('#r-texto').value = extras.reclamacion(t, titulo(t), tipo, problema);

  pintar();

  v('#r-problema').addEventListener('input', ev => { problema = ev.target.value; pintar(); });

    if (x.dataset.x === 'cerrar') cerrarCapa();
    else if (x.dataset.x === 'copiar') { (navigator.clipboard ? navigator.clipboard.writeText(texto) : Promise.reject()).then(() => aviso('Texto copiado')).catch(() => { v('#r-texto').select(); aviso('Selecciona y copia el texto'); }); }
    else if (x.dataset.x === 'enviar') {

      const files = fotos.map((f, i) => new File([blobs[f.k].blob], 'Ticket ' + (i + 1) + (esPdf(blobs[f.k]) ? '.pdf' : '.jpg'), { type: blobs[f.k].mime }));
      const datos = files.length && navigator.canShare && navigator.canShare({ files }) ? { files, text: texto } : { text: texto };
      if (navigator.share) navigator.share(datos).catch(() => {});
      else location.href = 'mailto:?subject=' + encodeURIComponent('Reclamación: ' + titulo(t)) + '&body=' + encodeURIComponent(texto);
    }
  });
}

// Pantalla de fotos del ticket (se abre desde la ficha)

  const c = abrirCapa(`<div class="top"><button class="boton-icono" data-x="cerrar" aria-label="Volver">${ico('atras')}</button><h3>Fotos del ticket</h3>

      <button class="btn ancho pri" data-x="guardar">${ico('descargar')}${fotos.length > 1 ? 'Guardar fotos en el móvil' : 'Guardar en el móvil'}</button>

    </div>`, () => Object.values(urls).forEach(u => URL.revokeObjectURL(u)));
  const box = c.querySelector('#f-foto');
  async function mostrar(i) {
    sel = i; const f = fotos[i];
    c.querySelectorAll('#f-tiras .ft').forEach((b, j) => b.classList.toggle('sel', j === i));
    if (!f) { box.innerHTML = `<div class="ph">${ico('ticket')}<br>Sin foto</div>`; return; }
    if (!urls[f.k]) box.innerHTML = f.mini ? `<img src="${esc(f.mini)}" alt="" style="filter:blur(6px)">` : `<div class="ph"><div class="rueda" style="margin:0 auto 8px"></div>Cargando…</div>`;
    try {
      if (!urls[f.k]) { const r = await obtenerFoto(t, f); if (!r) { if (sel === i) box.innerHTML = `<div class="ph">${ico('ticket')}<br>Foto no disponible</div>`; return; } blobs[f.k] = r; urls[f.k] = URL.createObjectURL(r.blob); }
      if (sel !== i) return;
      box.innerHTML = esPdf(blobs[f.k])
        ? `<div class="ph">${ico('archivo')}<br><b>Factura en PDF</b><br><button class="btn" data-x="pdf" style="margin:10px auto 0">Abrir PDF</button></div>`
        : `<img src="${urls[f.k]}" alt="Foto del ticket" data-x="ver"><button class="lupa" data-x="ver">${ico('ampliar')}Ampliar</button>`;
    } catch (err) { if (sel === i) box.insertAdjacentHTML('beforeend', '<button class="lupa" data-x="reintentar">Sin conexión · reintentar</button>'); }
  }
  mostrar(0);
  c.addEventListener('click', ev => {
    const x = ev.target.closest('[data-x]'); if (!x) return;
    const a = x.dataset.x, f = fotos[sel];
    if (a === 'cerrar') cerrarCapa();
    else if (a === 'sel') mostrar(+x.dataset.i);
    else if (a === 'editar') { cerrarCapa(); cerrarCapa(); editar(t.id, []); }
    else if (a === 'compartir') accionFotos(t, blobs, 'enviar');
    else if (a === 'guardar') accionFotos(t, blobs, 'guardar', c.querySelector('.envoltura'));
    else if (a === 'ver' && f && urls[f.k]) {
      const vz = document.createElement('div'); vz.className = 'visor';
      vz.innerHTML = `<img src="${urls[f.k]}" alt="Ticket"><button class="cerrar" aria-label="Cerrar">${ico('cerrar')}</button>`;
      vz.querySelector('img').addEventListener('dblclick', e2 => e2.target.classList.toggle('zoom'));
      vz.querySelector('.cerrar').addEventListener('click', () => vz.remove());
      document.body.appendChild(vz);
    }
    else if (a === 'pdf' && f && urls[f.k]) window.open(urls[f.k], '_blank');
    else if (a === 'reintentar') mostrar(sel);
  });
}

/* ---------- Sincronización ---------- */
let sincronizando = false, syncT = null, estadoSync = '';
function punto() {
  const p = $('#punto'); p.className = 'punto';
  if (!cfg.url) p.title = 'Sin sincronizar';
  else if (estadoSync === 'err') p.classList.add('err');
  else if (pendientes.size || sincronizando) p.classList.add('pend');
  else p.classList.add('ok');
}
function programarSync(ms = 1500) { punto(); clearTimeout(syncT); syncT = setTimeout(sincronizar, ms); }
async function sincronizar() {
  if (!cfg.url || !cfg.clave || sincronizando || !navigator.onLine) { punto(); return; }
  if (localStorage.getItem('mt-clave-mala') === cfg.clave) { estadoSync = 'err'; punto(); return; }
  sincronizando = true; punto();
  try {
    // 1. Fotos sin subir y textos sin leer (guardados sin cobertura)
    let leidos = false;
    for (const t0 of tickets.filter(t => !t.borrado && (t.fotos || []).some(f => !f.fotoId || f.leer))) {
      for (const f0 of t0.fotos.filter(f => !f.fotoId || f.leer)) {
        const loc = await fotoLocal(t0, f0); if (!loc) continue;
        const b64 = await aB64(loc.blob);
        let txt = null, fotoId = null;
        if (f0.leer) {
          try { txt = ((await api('leer', { b64, mime: f0.mime }, 120000)).texto || '').trim(); }
          catch (e) { if (e.message === 'clave' || e.message === 'bloqueado') throw e; f0.fallos = (f0.fallos || 0) + 1; if (f0.fallos >= 3) txt = ''; }
        }
        if (!f0.fotoId) fotoId = (await api('subir', { id: t0.id + '-' + f0.k, b64, mime: f0.mime }, 120000)).fotoId;
        const t = tickets.find(x => x.id === t0.id), f = t && !t.borrado && (t.fotos || []).find(x => x.k === f0.k);
        if (!f) continue;
        if (fotoId) f.fotoId = fotoId;
        if (f0.fallos) f.fallos = f0.fallos;
        if (txt !== null) {
          delete f.leer; delete f.fallos; leidos = true;
          t.texto = ((t.texto || '') + '\n' + txt).trim().slice(0, 8000);
          aplicarLectura(t, analizarTicket(txt, hoy()), k => ({
            tienda: !t.tienda, total: t.total == null, num: !t.num, concepto: !t.concepto,
            fecha: !t.fechaManual && !t.fechaLeida, plazos: !t.plazosManual && !t.plazosTienda
          })[k]);
        }
        t.leerPend = t.fotos.some(x => x.leer); t.t = Date.now(); pendientes.add(t.id); guardarLocal();
      }
    }
    if (leidos) pintarInicio();
    // 2. Datos
    const envio = tickets.filter(t => pendientes.has(t.id));
    const marcas = {}; envio.forEach(t => marcas[t.id] = t.t);
    let desde = 0; try { desde = Number(localStorage.getItem('mt-desde') || 0); } catch (e) {}
    const j = await api('sync', { tickets: envio, desde });
    const local = {}; tickets.forEach(t => local[t.id] = t);
    // parcial: el servidor solo manda lo que cambió desde la última vez; si no, manda todo
    const base = {};
    tickets.forEach(t => { if (j.parcial || pendientes.has(t.id)) base[t.id] = t; });
    (j.tickets || []).forEach(s => { const l = local[s.id]; base[s.id] = l && (l.t || 0) > (s.t || 0) ? l : s; });
    const antes = JSON.stringify(vivos().map(t => t.id + t.t));
    Object.values(local).forEach(l => {
      const n = base[l.id]; if (l.borrado || n === l) return;
      if (!n || n.borrado) borrarLocales(l);
      else (l.fotos || []).forEach(f => { if (!(n.fotos || []).some(g => g.k === f.k)) idb.del(claveImg(l, f)); });
    });
    tickets = Object.values(base).map(migrar);
    if (j.ahora) try { localStorage.setItem('mt-desde', String(j.ahora)); } catch (e) {}
    envio.forEach(t => { const a = local[t.id]; if (!a || a.t === marcas[t.id]) pendientes.delete(t.id); });
    // Facturas de Gmail: el servidor guarda el texto y aquí se sacan los datos
    let analizados = 0;
    tickets.forEach(t => {
      if (!t.analizar || t.borrado) return;
      aplicarLectura(t, analizarTicket(t.texto || '', hoy()), k => ({
        tienda: !t.tienda, total: t.total == null, num: !t.num, concepto: !t.concepto, fecha: false, plazos: !t.plazosManual
      })[k]);
      delete t.analizar; t.t = Date.now(); pendientes.add(t.id); analizados++;
    });
    if (analizados) programarSync(2000);
    estadoSync = 'ok'; guardarLocal(); purgarLocal();
    if (antes !== JSON.stringify(vivos().map(t => t.id + t.t))) pintarInicio();
  } catch (e) {
    estadoSync = 'err';
    if (e.message === 'clave') { try { localStorage.setItem('mt-clave-mala', cfg.clave); } catch (x) {} aviso('Contraseña incorrecta: revísala en Ajustes'); }
    if (e.message === 'bloqueado') aviso('Demasiados intentos: espera 10 minutos');
  } finally { sincronizando = false; punto(); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { purgarLocal(); pintarInicio(); sincronizar(); } });
window.addEventListener('online', () => sincronizar());
setInterval(() => { if (!document.hidden) sincronizar(); }, 60000);

/* ---------- Ajustes ---------- */
['#t-ajustes', '#b-ajustes-cab', '#punto'].forEach(s => $(s).addEventListener('click', abrirAjustes));
$('#t-inicio').addEventListener('click', () => { while (capas.length) cerrarCapa(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
function abrirAjustes() {
  if (capas.length) return;
  $('#t-ajustes').classList.add('on'); $('#t-inicio').classList.remove('on');
  const n = vivos().length, np = vivos().filter(t => estado(t).papelera).length, ni = vivos().filter(t => t.importante).length;
  const c = abrirCapa(`<div class="top"><button class="boton-icono" data-x="cerrar" aria-label="Volver">${ico('atras')}</button><h3>Ajustes</h3></div>
    <div class="envoltura ajustes">
      <div class="carnet">
        <div class="ranura"></div>
        <div class="icono-c">${ico('ticket')}</div>
        <div class="nom">Mis Tickets</div>
        <div class="sellos"><span class="sello">${VERSION}</span><span class="sello ${cfg.url ? 'vivo' : ''}">${cfg.url ? 'Google Drive activo' : 'Solo este dispositivo'}</span></div>
        <div class="lineas">${n} guardados${np ? ' · ' + np + ' en papelera' : ''}${ni ? ' · ' + ni + ' sin borrar' : ''}<br>Avisos · Google Calendar<br>Borrado · ${DIAS_PAPELERA} días tras vencer</div>
      </div>
      <h2 class="sec">Sincronización con Google</h2>
      <div class="bloque">
        <label class="campo"><span>Dirección del script</span><input id="a-url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
        <label class="campo"><span>Contraseña</span><input id="a-clave" type="password" autocomplete="current-password"></label>
        <div class="estado-sync" id="a-estado"></div>
      </div>
      <button class="btn ancho pri" data-x="probar">${ico('sync')}Guardar y sincronizar</button>
      <p>Las fotos y los datos se guardan en tu Google Drive (carpeta «Mis Tickets») y se sincronizan entre el iPhone y el iPad. Los avisos llegan por Google Calendar: 3 días antes del último día de devolución y 3 semanas antes de que acabe la garantía.</p>
      <h2 class="sec">Facturas de Gmail</h2>
      <div class="bloque"><div class="dato" style="display:block"><div style="font-weight:600;line-height:1.5;font-size:14.5px">Pon la etiqueta <b>«Tickets»</b> a un correo de compra (en Gmail: <i>Mover a › Tickets</i>) y aparecerá aquí en menos de una hora, con su PDF o con el propio correo guardado en PDF.</div></div></div>
      <button class="btn ancho" data-x="gmail">${ico('sync')}Buscar facturas ahora</button>
      <h2 class="sec">Copia de seguridad</h2>
      <div class="bloque"><div class="dato" style="display:block"><div style="font-weight:600;line-height:1.5;font-size:14.5px" id="a-copia">Un ZIP con todas las fotos, un resumen para Excel y los datos. Además, el script guarda una copia de los datos cada semana en Drive.</div></div></div>
      <button class="btn ancho" data-x="copia">${ico('descargar')}Preparar copia completa</button>
      <h2 class="sec">Borrado automático</h2>
      <div class="bloque"><div class="dato"><div class="k">Tickets</div><div class="v">${n} guardados${np ? ' · ' + np + ' en la papelera' : ''}${ni ? ' · ' + ni + ' sin borrar nunca' : ''}</div></div>
        <div class="dato"><div class="k">Cuándo</div><div class="v" style="font-weight:600">Cuando vencen la devolución y la garantía, el ticket pasa a la papelera y a los ${DIAS_PAPELERA} días se borra con sus fotos, también de Drive. Los marcados «No borrar nunca» se quedan siempre.</div></div></div>

    </div>`, () => { copiaZip = null; $('#t-ajustes').classList.remove('on'); $('#t-inicio').classList.add('on'); });
  c.querySelector('#a-url').value = cfg.url; c.querySelector('#a-clave').value = cfg.clave;
  const est = () => {
    const e = c.querySelector('#a-estado');
    e.innerHTML = !cfg.url ? `<span class="punto"></span>Sin configurar: los tickets solo están en este dispositivo`
      : estadoSync === 'err' ? `<span class="punto err"></span>No se pudo sincronizar`
        : pendientes.size ? `<span class="punto pend"></span>${pendientes.size} cambio(s) por subir` : `<span class="punto ok"></span>Todo sincronizado`;
  };
  est();
  c.addEventListener('click', async ev => {
    const x = ev.target.closest('[data-x]'); if (!x) return;
    if (x.dataset.x === 'cerrar') return cerrarCapa();
    if (x.dataset.x === 'gmail') {
      if (!cfg.url) return aviso('Primero conecta el script de Google');
      x.disabled = true; aviso('Buscando en Gmail…');
      try { const j = await api('gmail', {}, 120000); aviso(j.nuevos ? (j.nuevos === 1 ? '1 factura nueva' : j.nuevos + ' facturas nuevas') : 'No hay correos nuevos con la etiqueta «Tickets»'); if (j.nuevos) await sincronizar(); }
      catch (e) { aviso(e.message === 'accion' ? 'Actualiza el script de Google para usar esto' : 'No se pudo buscar ahora'); }
      x.disabled = false; return;
    }
    if (x.dataset.x === 'copia') { prepararCopia(x, c.querySelector('#a-copia')); return; }
    if (x.dataset.x === 'probar') {
      const url = c.querySelector('#a-url').value.trim(), clave = c.querySelector('#a-clave').value;
      if (url && !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) return aviso('La dirección debe terminar en /exec');
      const primera = !cfg.url && url;
      cfg.url = url; cfg.clave = clave;
      try { localStorage.setItem('mt-url', url); localStorage.setItem('mt-clave', clave); localStorage.removeItem('mt-clave-mala'); localStorage.removeItem('mt-desde'); } catch (e) {}
      if (!url) { est(); return aviso('Guardado sin sincronización'); }
      if (primera) tickets.forEach(t => pendientes.add(t.id));
      x.disabled = true; estadoSync = '';
      try { await api('ping'); await sincronizar(); aviso(estadoSync === 'ok' ? 'Conectado y sincronizado' : 'Conectado, pero falló la sincronización'); }
      catch (e) { estadoSync = 'err'; aviso(e.message === 'clave' ? 'Contraseña incorrecta' : e.message === 'bloqueado' ? 'Bloqueado 10 minutos por intentos fallidos' : 'No se pudo conectar con el script'); }
      x.disabled = false; est(); punto();
    }
  });
}

/* ---------- Copia completa (ZIP) ---------- */
let copiaZip = null;
async function prepararCopia(boton, info) {
  if (copiaZip) {                                         // segunda pulsación: guardar (el menú se abre al instante)
    const file = copiaZip;
    if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file] }).catch(() => {});
    else { const l = document.createElement('a'); l.href = URL.createObjectURL(file); l.download = file.name; document.body.appendChild(l); l.click(); l.remove(); }
    return;
  }
  boton.disabled = true;
  const lista = vivos(), archivos = [], enc = new TextEncoder(), usados = {};
  let faltan = 0, hechas = 0;
  const total = lista.reduce((s, t) => s + (t.fotos || []).length, 0);
  const limpio = s => String(s || '').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 50);
  try {
    for (const t of lista) for (const [i, f] of (t.fotos || []).entries()) {
      info.textContent = `Preparando fotos ${++hechas} de ${total}…`;
      const r = await obtenerFoto(t, f).catch(() => null);
      if (!r) { faltan++; continue; }
      let nom = `fotos/${t.fecha || 'sin-fecha'} ${limpio(titulo(t))}${(t.fotos || []).length > 1 ? ' (' + (i + 1) + ')' : ''}${esPdf(r) ? '.pdf' : '.jpg'}`;
      while (usados[nom]) nom = nom.replace(/(\.\w+)$/, ' bis$1'); usados[nom] = 1;
      archivos.push({ nombre: nom, datos: new Uint8Array(await r.blob.arrayBuffer()) });
    }
    const csv = n => '"' + String(n ?? '').replace(/"/g, '""') + '"';
    const filas = [['Producto', 'Tienda', 'Fecha', 'Importe', 'Nº ticket', 'Identificador', 'Devolución hasta', 'Garantía hasta', 'No borrar', 'Fotos', 'Notas']]
      .concat(lista.map(t => [titulo(t), t.tienda, t.fecha, t.total != null ? String(t.total.toFixed(2)).replace('.', ',') : '', t.num, t.ident, t.devHasta, t.garHasta, t.importante ? 'sí' : '', (t.fotos || []).length, t.notas]));
    archivos.unshift(
      { nombre: 'resumen.csv', datos: enc.encode('\uFEFF' + filas.map(f => f.map(csv).join(';')).join('\r\n')) },
      { nombre: 'datos.json', datos: enc.encode(JSON.stringify({ app: 'Mis Tickets', version: VERSION, fecha: new Date().toISOString(), tickets: lista.map(t => Object.assign({}, t, { fotos: (t.fotos || []).map(f => ({ k: f.k, fotoId: f.fotoId, mime: f.mime })) })) }, null, 1)) });
    const blob = extras.zip(archivos);
    copiaZip = new File([blob], `Mis Tickets ${hoy()}.zip`, { type: 'application/zip' });
    info.textContent = `Copia lista: ${lista.length} tickets, ${archivos.length - 2} fotos (${(blob.size / 1048576).toFixed(1)} MB)${faltan ? `. ${faltan} fotos no se pudieron descargar ahora (sin conexión)` : ''}.`;
    boton.innerHTML = `${ico('descargar')}Guardar copia en el móvil`;
  } catch (e) { info.textContent = 'No se pudo preparar la copia: ' + (e.message || e); }
  boton.disabled = false;
}

/* ---------- Usabilidad: teclado, cabecera fija y gesto para volver ---------- */
const esCampo = el => el && ((el.tagName === 'INPUT' && !/^(checkbox|file|radio|button)$/.test(el.type)) || el.tagName === 'TEXTAREA');
document.addEventListener('focusin', e => { if (esCampo(e.target)) document.body.classList.add('teclado'); });
document.addEventListener('focusout', () => setTimeout(() => { if (!esCampo(document.activeElement)) document.body.classList.remove('teclado'); }, 80));
// Intro: buscar cierra el teclado; en formularios pasa al siguiente campo
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !esCampo(e.target) || e.target.tagName === 'TEXTAREA') return;
  e.preventDefault();
  const capa = e.target.closest('.capa'), campos = capa ? [...capa.querySelectorAll('input:not([type=checkbox]):not([type=file]):not([type=date]),textarea')] : [];
  const sig = campos[campos.indexOf(e.target) + 1];
  if (e.target.id !== 'buscar' && sig && e.target.getAttribute('enterkeyhint') === 'next') sig.focus(); else e.target.blur();
});
// Al deslizar la lista con el buscador abierto, se cierra el teclado
window.addEventListener('touchmove', () => { if (document.activeElement && document.activeElement.id === 'buscar' && !capas.length) document.activeElement.blur(); }, { passive: true });
// Cabecera: el título se va con el scroll, buscador y filtros se quedan arriba
function ajustarCabecera() { const b = $('.cab .buscar'); if (b) $('header.cab').style.top = -(b.offsetTop - 10) + 'px'; }
window.addEventListener('resize', ajustarCabecera); ajustarCabecera();
// Deslizar desde el borde izquierdo para volver (como en las apps del iPhone)
(() => {
  let x0 = 0, y0 = 0, capa = null, dx = 0;
  document.addEventListener('touchstart', e => {
    const t = e.touches[0]; capa = capas[capas.length - 1] || null; dx = 0;
    if (!capa || t.clientX > 24 || $('.visor')) { capa = null; return; }
    x0 = t.clientX; y0 = t.clientY; capa.classList.remove('soltando');
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!capa) return;
    const t = e.touches[0]; dx = t.clientX - x0;
    if (Math.abs(t.clientY - y0) > 40 && dx < 30) { capa.style.transform = ''; capa = null; return; }
    if (dx > 0) { capa.classList.add('arrastrando'); capa.style.transform = `translateX(${dx}px)`; }
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (!capa) return;
    const c = capa; capa = null; c.classList.remove('arrastrando'); c.classList.add('soltando');
    if (dx > 90) { const b = c.querySelector('.top [data-x=cerrar]'); c.style.transform = ''; if (b) b.click(); }
    else c.style.transform = '';
  });
})();

/* ---------- Arranque ---------- */
cargarTickets().then(() => { purgarLocal(); pintarInicio(); punto(); sincronizar(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
